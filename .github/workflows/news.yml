name: News to Telegram

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["bot.py", "feeds.json", ".github/workflows/news.yml"]

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAX_PER_RUN: "6"
          MAX_AGE_HOURS: "24"
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -f .state || true
          if ! git diff --cached --quiet; then
            git commit -m "state: seen list [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" --autostash || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"
          fi
