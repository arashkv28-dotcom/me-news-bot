name: News to Telegram

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["bot.py", "feeds.json", ".github/workflows/news.yml"]

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and tick bot
        run: |
          curl -sS --max-time 280 "https://me-news-bot.onrender.com/tick" || true
          sleep 45
          curl -sS --max-time 280 "https://me-news-bot.onrender.com/tick" || true
